project: s6e10
seed: 42

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  splits: splits/fold_v1.json
  reports: reports
  figures: reports/figures
  oof_dir: reports/oof
  exp_log: reports/exp_log.csv

data:
  train_file: train.csv
  test_file: test.csv
  sample_sub_file: sample_submission.csv
  target: satisfaction
  id_col: id

# 划分策略：kfold | stratified | group | time
split:
  strategy: stratified
  n_splits: 5
  seed: 42
  time_col: null
  # group 策略的实体列；填 distance_bins 表示用 Flight Distance 分箱当伪实体
  group_col: distance_bins
  group_bins: 50

# 留空 = 自动探测（会打印并把结果写入 reports/schema.json）
features:
  service_cols: []
  cat_cols: []
  num_cols: []

model:
  lgbm:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 50
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    n_jobs: -1
    verbose: -1
  lr:
    C: 1.0
    max_iter: 200

eval:
  metric: roc_auc

# 数据契约：scripts/verify.py 用它判断"还是不是同一份数据、同一套划分、同一个基线"。
# 换数据集时必须同步改这里；设成 null 则跳过所有 dataset-specific 检查。
contract:
  train_shape: [699635, 23]     # raw train.csv 行 × 列
  test_shape: [299844, 22]      # raw test.csv 行 × 列
  target_rate: 0.4436           # train 正例率（容差 5e-4）
  n_splits: 5                   # 冻结划分的折数
  base_auc: 0.958829            # exp_log 里 lgbm + base 的 5 折 CV AUC
  service_cols:                 # 13 个 0-5 服务评分列
    - Inflight wifi service
    - Departure/Arrival time convenient
    - Ease of Online booking
    - Gate location
    - Food and drink
    - Online boarding
    - Seat comfort
    - Inflight entertainment
    - On-board service
    - Leg room service
    - Baggage handling
    - Checkin service
    - Cleanliness
  cat_cols:                     # 4 个类别列
    - Gender
    - Customer Type
    - Type of Travel
    - Class
