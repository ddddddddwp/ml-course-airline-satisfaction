project: s6e10
seed: 42

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  splits: splits/fold_v1.json
  reports: reports
  oof_dir: reports/oof
  exp_log: reports/exp_log.csv

data:
  train_file: train.csv
  test_file: test.csv
  sample_sub_file: sample_submission.csv
  target: satisfaction
  id_col: id

# 划分策略：kfold | stratified | group | time
split:
  strategy: stratified
  n_splits: 5
  seed: 42
  time_col: null
  # group 策略的实体列；填 distance_bins 表示用 Flight Distance 分箱当伪实体
  group_col: distance_bins
  group_bins: 50

# 留空 = 自动探测（会打印并把结果写入 reports/schema.json）
features:
  service_cols: []
  cat_cols: []
  num_cols: []

model:
  lgbm:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 50
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    n_jobs: -1
    verbose: -1
  lr:
    C: 1.0
    max_iter: 200

eval:
  metric: roc_auc
